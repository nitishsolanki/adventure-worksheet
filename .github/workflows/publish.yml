name: Publish Adventure Worksheet

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Central Time schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          central_offset=$(TZ=America/Chicago date +%z)
          if { [ "$central_offset" = "-0500" ] && [ "$SCHEDULE" = "30 21 * * *" ]; } ||
             { [ "$central_offset" = "-0600" ] && [ "$SCHEDULE" = "30 22 * * *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-check
    if: needs.schedule-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Drive client
        run: python -m pip install -r requirements.txt

      - name: Validate Google Drive configuration
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "GOOGLE_DRIVE_FOLDER_ID is missing. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON is missing. Add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Download episode files from Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/download-drive.py

      - name: Select current or newest episode
        shell: pwsh
        run: ./scripts/select-current-file.ps1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
